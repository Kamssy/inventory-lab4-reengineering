services:
  api:
    build: .
    container_name: inventory-api
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/inventory.db
    volumes:
      - db-data:/app/data

  db-viewer:
    image: coleifer/sqlite-web
    container_name: inventory-db-viewer
    environment:
      - SQLITE_DATABASE=inventory.db
    ports:
      - "8080:8080"
    volumes:
      - db-data:/data
    depends_on:
      - api

volumes:
  db-data: